<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transforming Robots</title>
</head>
<body>
<script src="function.js"></script> 
<h1>Transforming Robots</h1> 

<h2>Hover over the images to see them transform!</h2>

<img id="W-unicorn" src="Images/Unicorn Gundam Unicorn Mode.jpg.webp" alt="Unicorn Gundam Unicorn mode" width="500">

    <script>
        const image = document.getElementById("W-unicorn");

        image.addEventListener("mouseenter", function() {
            image.src = "Images/Unicorn Gundam Destroy Mode.jpg.webp";
        });

        image.addEventListener("mouseleave", function() {
            image.src = "Images/Unicorn Gundam Unicorn Mode.jpg.webp";
        });
    </script>


<img id="B-unicorn" src="Images/Banshee unicorn Mode.jpg.webp" alt="Banshee Unicorn Mode" width="500">

<script>
        const image = document.getElementById("B-unicorn");

        image.addEventListener("mouseenter", function() {
            image.src = "Images/Banshee unicorn Destroy Mode.jpg.webp";
        });

        image.addEventListener("mouseleave", function() {
            image.src = "Images/Banshee unicorn Mode.jpg.webp";
        });
    </script>

<img id="G-unicorn" src="Images/Phenex Unicorn Mode.jpg.webp" alt="Phenex Unicorn Mode" width="500">

</body>
</html>
